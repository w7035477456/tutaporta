# HAProxy config — FINAL PRODUCTION (multi-server cluster)
#
# Topology:
#   Load-balancer box : HAProxy (+ optional Nginx gate)  ← this file
#   Web cluster       : N × (Node/PM2 :40000 + local Postgres Replica)
#   DB Primary box    : Postgres Primary :50010 (apps connect directly; not routed by HAProxy)
#
#   Cloudflare → HAProxy :443 (TLS) → be_app (round-robin over web cluster :40000)
#
# Optional Nginx basic-auth gate (Nginx :41000 on this box):
#   HAProxy :443 → be_nginx_gate (Nginx :41000) → fe_web (127.0.0.1:50000) → be_app
#   Enable by switching default_backend in fe_https to be_nginx_gate.
#
# No sticky sessions: app servers are stateless (all state in Postgres/Redis).
# Web servers must firewall :40000 so only this HAProxy box can reach it.
#
# Deploy (on the load-balancer box):
#   sudo cp haproxy.prod.cfg /etc/haproxy/haproxy.cfg
#   sudo cp cloudflare-ips-v4.txt cloudflare-ips-v6.txt /etc/haproxy/
#   sudo haproxy -c -f /etc/haproxy/haproxy.cfg && sudo systemctl reload haproxy

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    nbthread 8
    maxconn 50000
    tune.ssl.default-dh-param 2048
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-keep-alive
    option redispatch
    retries 3
    timeout connect 5s
    # Phone QR photo POSTs and TutaPhoto videos (up to 100 MB) need long client/server timeouts.
    timeout client 300s
    timeout server 300s
    timeout http-request 120s
    timeout http-keep-alive 10s
    timeout queue 30s
    timeout tunnel 1h
    balance roundrobin
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# ---------------------------------------------------------------------------
# HTTP :80 → HTTPS (Cloudflare only; any other host → https://tutamall.com)
# ---------------------------------------------------------------------------
frontend fe_http
    bind *:80
    acl from_cloudflare src -f /etc/haproxy/cloudflare-ips-v4.txt
    acl from_cloudflare_v6 src -f /etc/haproxy/cloudflare-ips-v6.txt
    http-request deny if !from_cloudflare !from_cloudflare_v6
    acl host_canonical hdr(host) -i tutamall.com
    http-request redirect prefix https://tutamall.com code 301 unless host_canonical
    http-request redirect scheme https code 301 unless { ssl_fc }

# ---------------------------------------------------------------------------
# HTTPS :443 — TLS termination (Cloudflare only; any other host → https://tutamall.com)
# ---------------------------------------------------------------------------
frontend fe_https
    bind *:443 ssl crt /etc/haproxy/certs/site.pem
    acl from_cloudflare src -f /etc/haproxy/cloudflare-ips-v4.txt
    acl from_cloudflare_v6 src -f /etc/haproxy/cloudflare-ips-v6.txt
    http-request deny if !from_cloudflare !from_cloudflare_v6
    acl host_canonical hdr(host) -i tutamall.com
    http-request redirect prefix https://tutamall.com code 301 unless host_canonical
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    default_backend be_app
    # default_backend be_nginx_gate

# ---------------------------------------------------------------------------
# App backend — web cluster (Node/PM2 :40000 + local replica on each)
# Edit IPs to match the real web servers; comment out ones not built yet.
# Servers that are off simply show DOWN and get no traffic.
# ---------------------------------------------------------------------------
backend be_app
    balance roundrobin
    option httpchk GET /health
    http-check expect rstatus (2|3)[0-9][0-9]
    default-server inter 3s fall 3 rise 2 slowstart 10s
    server xbox3 192.168.222.203:40000 check
    server xbox4 192.168.222.204:40000 check
    server xbox5 192.168.222.205:40000 check
    server xbox6 192.168.222.206:40000 check
    server xbox7 192.168.222.207:40000 check
    server xbox8 192.168.222.208:40000 check
    server xbox9 192.168.222.209:40000 check

# ---------------------------------------------------------------------------
# Optional Nginx basic-auth gate (Nginx :41000 → 127.0.0.1:50000 → be_app)
# ---------------------------------------------------------------------------
backend be_nginx_gate
    server local_nginx 127.0.0.1:41000 check

frontend fe_web
    bind 127.0.0.1:50000
    option forwardfor
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    http-request set-header X-Forwarded-Proto https
    default_backend be_app

# ---------------------------------------------------------------------------
# Stats UI — http://<haproxy-box>:9900/stats (localhost + admin Mac only)
# ---------------------------------------------------------------------------
listen stats
    bind *:9900
    acl stats_allowed src 127.0.0.1 192.168.44.104
    http-request deny unless stats_allowed
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if stats_allowed
