# xbox1 192.168.202.201 — central Redis shared by every web server (xbox3, xbox4, clones).
# Included at the end of /etc/redis/redis.conf by install.sh, so these lines win.
# Holds caches (all with TTL) and the photo thumbnail queue v1:queue:photoThumbnail*.

# Loopback + the private 40 Gb LAN only; UFW (setupufw) limits 6379 to the web servers.
bind 127.0.0.1 192.168.202.201
port 6379
protected-mode yes
# requirepass lives in /etc/redis/redis-tutamall-auth.conf (written by install.sh, not in git).
include /etc/redis/redis-tutamall-auth.conf

# Cap memory so Redis never competes with Postgres on this box.
maxmemory 1gb
# Evict only TTL'd cache keys; queue keys have no TTL and are never evicted.
maxmemory-policy volatile-lru
