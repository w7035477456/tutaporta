# HAProxy config — PRE-PRODUCTION (all-in-one), xbox2 192.168.222.202
#
# Topology: ONE box runs everything
#   Cloudflare → HAProxy :443 (TLS) → Node/PM2 :40000 (127.0.0.1)
#   Postgres Primary + Replica :50010 and Redis :6379 on the same box (not routed by HAProxy)
#
# Optional Nginx basic-auth gate (sites-available/protected, listens :41000):
#   HAProxy :443 → be_nginx_gate (Nginx :41000) → fe_web (127.0.0.1:50000) → be_app
#   Enable by switching default_backend in fe_https to be_nginx_gate.
#
# No sticky sessions: app servers are stateless (all state in Postgres/Redis).
#
# Deploy:
#   sudo cp haproxy.preprod.cfg /etc/haproxy/haproxy.cfg
#   sudo haproxy -c -f /etc/haproxy/haproxy.cfg && sudo systemctl reload haproxy

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    nbthread 8
    maxconn 50000
    tune.ssl.default-dh-param 2048
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-keep-alive
    option redispatch
    retries 3
    timeout connect 5s
    # Phone QR photo POSTs and TutaPhoto videos (up to 100 MB) need long client/server timeouts.
    timeout client 300s
    timeout server 300s
    timeout http-request 120s
    timeout http-keep-alive 10s
    timeout queue 30s
    timeout tunnel 1h
    balance roundrobin
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# ---------------------------------------------------------------------------
# HTTP :80 → HTTPS (Cloudflare only; www → apex)
# ---------------------------------------------------------------------------
frontend fe_http
    bind *:80
    acl from_cloudflare src -f /etc/haproxy/cloudflare-ips-v4.txt
    acl from_cloudflare_v6 src -f /etc/haproxy/cloudflare-ips-v6.txt
    http-request deny if !from_cloudflare !from_cloudflare_v6
    acl host_www hdr(host) -i www.onlinemall.website
    http-request redirect prefix https://onlinemall.website code 301 if host_www
    http-request redirect scheme https code 301 unless { ssl_fc }

# ---------------------------------------------------------------------------
# HTTPS :443 — TLS termination (Cloudflare only; www → apex)
# ---------------------------------------------------------------------------
frontend fe_https
    bind *:443 ssl crt /etc/haproxy/certs/site.pem
    acl from_cloudflare src -f /etc/haproxy/cloudflare-ips-v4.txt
    acl from_cloudflare_v6 src -f /etc/haproxy/cloudflare-ips-v6.txt
    http-request deny if !from_cloudflare !from_cloudflare_v6
    acl host_www hdr(host) -i www.onlinemall.website
    http-request redirect prefix https://onlinemall.website code 301 if host_www
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    default_backend be_app
    # default_backend be_nginx_gate

# ---------------------------------------------------------------------------
# App backend — local Node/PM2 (cluster workers; pm2 reload keeps it UP)
# ---------------------------------------------------------------------------
backend be_app
    balance roundrobin
    option httpchk GET /health
    http-check expect rstatus (2|3)[0-9][0-9]
    default-server inter 3s fall 3 rise 2
    server xbox2 127.0.0.1:40000 check

# ---------------------------------------------------------------------------
# Optional Nginx basic-auth gate (Nginx :41000 → 127.0.0.1:50000 → be_app)
# ---------------------------------------------------------------------------
backend be_nginx_gate
    server local_nginx 127.0.0.1:41000 check

frontend fe_web
    bind 127.0.0.1:50000
    option forwardfor
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    http-request set-header X-Forwarded-Proto https
    default_backend be_app

# ---------------------------------------------------------------------------
# Stats UI — http://192.168.222.202:9900/stats (localhost + admin Mac only)
# ---------------------------------------------------------------------------
listen stats
    bind *:9900
    acl stats_allowed src 127.0.0.1 192.168.44.104
    http-request deny unless stats_allowed
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if stats_allowed
