;; PgBouncer — Ubuntu web server or Mac dev (session mode for advisory locks).
;; Install: scripts/install-pgbouncer.sh (see script header).
;;
;; App env after enable:
;;   DB_HOST=127.0.0.1
;;   DB_PORT=6432
;;
;; Postgres still listens on 50010; apps talk to PgBouncer on 6432.

[databases]
outdatedDBOct2021 = host=127.0.0.1 port=50010 dbname=outdatedDBOct2021

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = scram-sha-256
auth_file = /Users/a/.ssh/be/pgbouncer-userlist.txt
admin_users = test_user1
pool_mode = session
max_client_conn = 2000
default_pool_size = 40
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 80
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
log_connections = 0
log_disconnections = 0
stats_period = 60
pidfile = /tmp/pgbouncer-mac.pid
logfile = /Users/a/Library/Logs/pgbouncer.log
